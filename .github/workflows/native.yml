name: Native System contracts

on:
  pull_request:
  push:
    branches: [refactor/weave-api]

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared toolchain
        run: rustup show
      - name: Host API, client and boot contracts
        run: cargo test --locked -p system-api -p system-client -p system-support --tests --target x86_64-unknown-linux-gnu
      - name: Host ownership and declaration contracts
        run: |
          cargo test --locked --manifest-path tests/identity-state/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path tests/operator-policy/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path tests/declarations/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path tests/loader-image/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Complete RV64 Server in both profiles
        run: |
          cargo build --locked -p system-server --bin system --target riscv64gc-unknown-none-elf
          cargo build --locked -p system-server --bin system --release --target riscv64gc-unknown-none-elf
          cargo clippy --locked -p system-server --bin system --target riscv64gc-unknown-none-elf -- -D warnings
      - name: Complete production dependency graph
        run: |
          cargo metadata --locked --format-version 1
          cargo tree --locked -p system-server -e normal,build --target riscv64gc-unknown-none-elf
      - name: RV64 native libraries
        run: cargo clippy --locked -p system-api -p system-client -p system-support --lib --target riscv64gc-unknown-none-elf -- -D warnings
      - name: RV64 runtime component guest
        run: cargo clippy --locked --manifest-path tests/guest/runtime/Cargo.toml --target riscv64gc-unknown-none-elf -- -D warnings
      - name: RV64 production entry contract
        run: cargo clippy --locked --manifest-path tests/guest/entry/Cargo.toml --target riscv64gc-unknown-none-elf -- -D warnings
      - name: RV64 native Loader and ordinary image
        run: |
          cargo build --locked --manifest-path tests/guest/client/image/Cargo.toml --release --target riscv64gc-unknown-none-elf
          SYSTEM_LOADER_IMAGE="$GITHUB_WORKSPACE/tests/guest/client/image/target/riscv64gc-unknown-none-elf/release/system-loader-image" cargo clippy --locked --manifest-path tests/guest/loader/Cargo.toml --target riscv64gc-unknown-none-elf -- -D warnings
      - name: Build qualified single-Hart component platform
        env:
          RUSTFLAGS: -Crelocation-model=static -Cforce-frame-pointers=yes -Ccode-model=medium
        run: cargo build --locked --manifest-path tests/guest/runtime/platform/Cargo.toml --release --target riscv64gc-unknown-none-elf

  guests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    env:
      QEMU_RISCV64: qemu-system-riscv64
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
      RUSTFLAGS: -Crelocation-model=static -Cforce-frame-pointers=yes -Ccode-model=medium -Dwarnings
    steps:
      - name: Install QEMU and build tools
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl gcc git libc6-dev opensbi python3 qemu-system-misc
          qemu-system-riscv64 --version
          sha256sum "$QEMU_OPENSBI"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
      - name: Build qualified single-Hart component platform
        run: cargo build --locked --manifest-path tests/guest/runtime/platform/Cargo.toml --release --target riscv64gc-unknown-none-elf
      - name: Native heap, Supply and RPC on one and four Harts
        run: |
          mkdir -p .evidence
          rustc -Vv > .evidence/rustc.txt
          qemu-system-riscv64 --version > .evidence/qemu.txt
          sha256sum "$QEMU_OPENSBI" > .evidence/firmware.txt
          python3 tests/guest/runtime/run.py tests/guest/runtime/platform/target/riscv64gc-unknown-none-elf/release/system-runtime-platform --harts 1 4 > .evidence/runtime.log 2>&1
          cat .evidence/runtime.log
      - name: Production entry, immutable boot data and native services on one Hart
        run: python3 tests/guest/entry/run.py tests/guest/runtime/platform/target/riscv64gc-unknown-none-elf/release/system-runtime-platform --harts 1
      - name: Build all-Hart instruction test platform
        run: cargo build --locked --manifest-path tests/guest/runtime/platform/Cargo.toml --features instructions --target-dir tests/guest/runtime/platform/target/instructions --release --target riscv64gc-unknown-none-elf
      - name: Native ELF construction and User Team retirement on 1/2/4 Harts
        run: python3 tests/guest/loader/run.py tests/guest/runtime/platform/target/instructions/riscv64gc-unknown-none-elf/release/system-runtime-platform --harts 1 2 4
      - name: Complete release System application and ordinary User Teams
        run: python3 tests/guest/system/run.py tests/guest/runtime/platform/target/instructions/riscv64gc-unknown-none-elf/release/system-runtime-platform
      - name: Debug Loader and instruction platform on 1/2/4 Harts
        run: |
          cargo build --locked --manifest-path tests/guest/runtime/platform/Cargo.toml --features instructions --target-dir tests/guest/runtime/platform/target/instructions --target riscv64gc-unknown-none-elf
          python3 tests/guest/loader/run.py tests/guest/runtime/platform/target/instructions/riscv64gc-unknown-none-elf/debug/system-runtime-platform --profile debug --harts 1 2 4
      - name: Preserve Loader execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-loader
          path: |
            tests/guest/loader/target/evidence/**/*.json
            tests/guest/loader/target/evidence/**/*.log
            tests/guest/loader/target/evidence/**/*.lock
            tests/guest/loader/target/evidence/**/initrd.bin
            tests/guest/loader/target/evidence/**/system-loader-image
            tests/guest/loader/target/evidence/**/system-loader-guest
            tests/guest/runtime/platform/target/instructions/riscv64gc-unknown-none-elf/*/system-runtime-platform
          if-no-files-found: error
      - name: Preserve runtime composition evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime
          path: |
            .evidence/
            tests/guest/runtime/Cargo.lock
            tests/guest/runtime/platform/Cargo.lock
            tests/guest/runtime/platform/target/riscv64gc-unknown-none-elf/release/system-runtime-platform
          include-hidden-files: true
          if-no-files-found: error
