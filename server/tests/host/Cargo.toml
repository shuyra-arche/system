[package]
name = "system-server-contracts"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[test]]
name = "app"
path = "../app/mod.rs"

[[test]]
name = "control"
path = "../control/mod.rs"

[[test]]
name = "identity"
path = "../identity/mod.rs"

[[test]]
name = "loader"
path = "../loader/mod.rs"

[[test]]
name = "operator"
path = "../operator/mod.rs"

[[test]]
name = "runtime"
path = "../runtime/mod.rs"

[[test]]
name = "supply"
path = "../supply/mod.rs"

[[test]]
name = "control-retirement"
path = "../control-retirement/mod.rs"

[dependencies]
unit-contract = { package = "unit", git = "https://github.com/shuyra-arche/unit.git", rev = "aaa2b58c1ef0b40428dcc71d1321736156551109", default-features = false }
system-protocol = { package = "system-api", path = "../../../api" }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
system-client = { path = "../../../client" }
twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "932454c07bd2673ac7d6d9612d36182aae71e8b2" }
erra = { version = "0.2.0", default-features = false }

[dev-dependencies]
toml = "0.9"
