[package]
name = "system-native-runner"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "system-runner"
path = "src/main.rs"

[[test]]
name = "contracts"
path = "tests/mod.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
kernel-verification = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
serde_json = "1"
