[package]
name = "system-server-contracts"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[test]]
name = "supervision"
path = "supervision/mod.rs"

[[test]]
name = "runtime"
path = "runtime/mod.rs"

[[test]]
name = "organization"
path = "organization/mod.rs"

[dependencies]
unit-contract = { package = "unit", git = "https://github.com/shuyra-arche/unit.git", rev = "aaa2b58c1ef0b40428dcc71d1321736156551109", default-features = false }
system-protocol = { package = "system-api", path = "../../api" }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }

[dev-dependencies]
toml = "0.9"
