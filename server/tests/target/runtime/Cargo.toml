[package]
name = "system-runtime-guest"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[[bin]]
name = "system-runtime-guest"
path = "main.rs"
test = false
bench = false
[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
talc = { version = "5.1.1", default-features = false }
system-protocol = { package = "system-api", path = "../../../../api" }
system-client = { path = "../../../../client" }
twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "932454c07bd2673ac7d6d9612d36182aae71e8b2" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }
erra = { version = "0.2.0", default-features = false }
[profile.release]
panic = "abort"
