kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "6d78ff68b95602deac2480a5addf7e693fd88fcc" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }

kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "6d78ff68b95602deac2480a5addf7e693fd88fcc" }

twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "37c75f5bbb0794b4e9daf61bf0a93e81492e3daf" }
erra = { version = "0.2.0", default-features = false }
