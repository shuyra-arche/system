[package]
name = "operator-policy-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"
doctest = false

[dependencies]
system-protocol = { package = "system-api", path = "../../api" }
system-client = { path = "../../client" }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "684f479c45dc2d94d405b32b4ffc6334a4233fc9" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }

kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "684f479c45dc2d94d405b32b4ffc6334a4233fc9" }

twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "8c68cbeffd024b4105a6a7c2f4baaab330994ca1" }
erra = { version = "0.2.0", default-features = false }
