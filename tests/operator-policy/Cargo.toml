kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "23dec6b30e1ec08f42d3701e2613acd8c562c459" }

twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "8144be4286c36a6d20271aac9e44ca56049a2430" }
erra = { version = "0.2.0", default-features = false }
