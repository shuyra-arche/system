kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "8b3586206a4795fc8289031887bb62d6d7598a69" }

twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "447871e10f2e110a43c01752fc3b70773c1fa47b" }
erra = { version = "0.2.0", default-features = false }
