[package]
name = "system-runtime-guest"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[[bin]]
name = "system-runtime-guest"
path = "main.rs"
test = false
bench = false
[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "9c0fc4da1ca4e41bd6ddea3cba2b5964c07323d2" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "9c0fc4da1ca4e41bd6ddea3cba2b5964c07323d2" }
talc = { version = "5.1.1", default-features = false }
system-protocol = { package = "system-api", path = "../../../api" }
system-client = { path = "../../../client" }
twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "e547f60b2ed4c3c09c49de3a360210d90d4ad972" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }
erra = { version = "0.2.0", default-features = false }
[profile.release]
panic = "abort"
