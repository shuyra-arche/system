[package]
name = "system-runtime-platform"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "system-runtime-platform"
path = "main.rs"
test = false
bench = false

[dependencies]
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "b2eb37e2af134e4bb4248df454c437b06c1f93c0" }
platform-riscv = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "b5468739f2d7e36d64198de743a13d6ccabc6666" }
fdt = { version = "0.1.5", default-features = false }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
