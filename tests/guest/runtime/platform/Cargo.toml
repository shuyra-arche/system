[package]
name = "system-runtime-platform"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "system-runtime-platform"
path = "main.rs"
test = false
bench = false

[dependencies]
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "0ee104ddf94ca74a18135bf216b888a2437bd6f8" }
platform-riscv = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "7895b5a581119cffb284e7c1433150e11dda2d81" }
fdt = { version = "0.1.5", default-features = false }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
