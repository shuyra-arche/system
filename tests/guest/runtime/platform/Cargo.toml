[package]
name = "system-runtime-platform"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "system-runtime-platform"
path = "main.rs"
test = false
bench = false

[features]
instructions = []

[dependencies]
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "9c0fc4da1ca4e41bd6ddea3cba2b5964c07323d2" }
platform-riscv = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "5ec59a466ed5f05acb9c5559aa1cc5e91fa5dfa4" }
fdt = { version = "0.1.5", default-features = false }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
