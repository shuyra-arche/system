[package]
name = "system-runtime-platform"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "system-runtime-platform"
path = "main.rs"
test = false
bench = false

[features]
instructions = []

[dependencies]
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "2cfb581a7ef767ebae0fda4864ed5da625ef067e" }
platform-riscv = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "a6f4fc0d1aaa45fef598fdf4d3a73a7cd7d0b09a" }
fdt = { version = "0.1.5", default-features = false }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
