[package]
name = "system-runtime-platform"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "system-runtime-platform"
path = "main.rs"
test = false
bench = false

[features]
instructions = []

[dependencies]
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "684f479c45dc2d94d405b32b4ffc6334a4233fc9" }
platform-riscv = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "58498c13f41ad64a1fc09af338802b279347c9c8" }
fdt = { version = "0.1.5", default-features = false }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
