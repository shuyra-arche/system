[package]
name = "system-handoff-guest"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[[bin]]
name = "system-handoff-guest"
path = "main.rs"
test = false
bench = false
[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "12cb1b5ae7fcd57b46cc0103a0f30ea29631724e" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "12cb1b5ae7fcd57b46cc0103a0f30ea29631724e" }
talc = { version = "5.1.1", default-features = false }
system-protocol = { package = "system-api", path = "../../../api" }
system-client = { path = "../../../client" }
twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "f835021f6afa80e68186846feb95260717487104" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }
erra = { version = "0.2.0", default-features = false }
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
