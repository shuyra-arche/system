[package]
name = "system-entry-contract"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
name = "system_server"
path = "lib.rs"
test = false
doctest = false
[[bin]]
name = "system"
path = "../../../server/src/main.rs"
test = false
bench = false
[dependencies]
system-support = { path = "../../../support" }
system-protocol = { package = "system-api", path = "../../../api" }
unit-contract = { package = "unit", git = "https://github.com/shuyra-arche/unit.git", rev = "aaa2b58c1ef0b40428dcc71d1321736156551109", default-features = false }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "b2eb37e2af134e4bb4248df454c437b06c1f93c0" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "b2eb37e2af134e4bb4248df454c437b06c1f93c0" }
talc = { version = "5.1.1", default-features = false }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }
system-client = { path = "../../../client" }
twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "bbab13f5df3e4bad24314cd5a18f19f26452ce66" }
erra = { version = "0.2.0", default-features = false }
[profile.release]
panic = "abort"
