[package]
name = "system-client-guest"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "system-client-guest"
path = "main.rs"
test = false
bench = false

[dependencies]
system-client = { path = "../../../client" }
twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "56b2be2017a035eabe140268cb6c195dfb6215d2" }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "5da3ae3e0b971f34a003a31d344ee20593725e53" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "5da3ae3e0b971f34a003a31d344ee20593725e53" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }

system-protocol = { package = "system-api", path = "../../../api" }

erra = { version = "0.2.0", default-features = false }

[profile.release]
panic = "abort"
