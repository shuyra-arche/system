[package]
name = "system-client-guest"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "system-client-guest"
path = "main.rs"
test = false
bench = false

[dependencies]
system-client = { path = "../../../client" }
twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "8144be4286c36a6d20271aac9e44ca56049a2430" }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "23dec6b30e1ec08f42d3701e2613acd8c562c459" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "23dec6b30e1ec08f42d3701e2613acd8c562c459" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc", features = ["alloc"] }

system-protocol = { package = "system-api", path = "../../../api" }

erra = { version = "0.2.0", default-features = false }

[profile.release]
panic = "abort"
